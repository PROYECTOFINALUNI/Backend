services:
  postgres:
    image: postgres:16.9-bookworm
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Publish the container's Postgres on host port 5433 (5432 is used by a local
    # Postgres) so tools like pgAdmin can inspect the database the backend uses.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: insecure-development-only
      DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://expenses:development-only@postgres:5432/expenses
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # JWT bearer tokens authenticate the REST API (all roles).
      JWT_ACCESS_MINUTES: "15"
      JWT_REFRESH_DAYS: "7"
      # Session/CSRF settings only protect the Django Admin site at /admin/.
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
